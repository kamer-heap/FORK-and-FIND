<VirtualHost *:80>
    ServerName forkfind.local
    DocumentRoot /var/www/forkfind/public

    <Directory /var/www/forkfind/public>
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/forkfind_error.log
    CustomLog ${APACHE_LOG_DIR}/forkfind_access.log combined
</VirtualHost>
